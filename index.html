<script>
      document.addEventListener('DOMContentLoaded', function() {
            if (typeof feather !== 'undefined') { feather.replace(); }
            const images = document.querySelectorAll('.zoom-image');
            if (images.length > 0 && typeof mediumZoom !== 'undefined') {
                  mediumZoom(images, {
                        background: 'rgba(0, 0, 0, 0.7)',
                        margin: 0,
                  });
            }

            
            (function() {
                var targets = document.querySelectorAll('.title h1.title, h1.title, .site-description p, p.site-description');
                if (!targets.length) return;

                var katakana = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789!?#$@&%';

                targets.forEach(function(el) {
                    var originalText = el.textContent.trim();
                    if (!originalText) return;

                    var length = originalText.length;
                    var step = 0;
                    var maxSteps = length + 14;
                    var intervalMs = 65;

                    function getRandomChar() {
                        return katakana.charAt(Math.floor(Math.random() * katakana.length));
                    }

                    var timer = setInterval(function() {
                        step++;
                        var revealedLength = Math.floor((step / maxSteps) * length);
                        var result = '';

                        for (var i = 0; i < length; i++) {
                            if (i < revealedLength) {
                                result += originalText.charAt(i);
                            } else {
                                result += getRandomChar();
                            }
                        }

                        if (revealedLength < length) {
                            result += '<span class="decrypt-cursor">█</span>';
                        }

                        el.innerHTML = result;

                        if (step >= maxSteps) {
                            clearInterval(timer);
                            el.textContent = originalText;
                        }
                    }, intervalMs);
                });
            })();
      });
</script>
